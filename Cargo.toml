[package]
name = "wally"
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
description = "A minimal Wayland wallpaper setter with GIF and animated WebP support"
license = "GPL-3.0-or-later"
repository = "https://github.com/SONGOKU00mjk/WALLY"
homepage = "https://github.com/SONGOKU00mjk/WALLY"
readme = "README.md"
keywords = ["wayland", "wallpaper", "swaybg", "layer-shell", "gif"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
# Pure-Rust Wayland client: no system libwayland, no pkg-config, no C
# compiler required to build.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Image decoding. `webp` maps to image-webp (pure Rust) and provides BOTH
# static and animated WebP, exactly like `gif` does for GIF. image's own
# `avif` feature is deliberately absent — it is encode-only (rav1e); AVIF
# decoding comes from avif-decode below.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tga",
    "pnm",
    "qoi",
    "hdr",
    "tiff",
    "dds",
    "ff",
] }

# Decode-only AVIF: pure-Rust rav1d (a dav1d port) + avif-parse container
# support. No encoder, no C library, no system deps. `default-features =
# false` drops its CLI-only lodepng dependency. x86_64 builds need nasm
# (SIMD assembly); aarch64 takes the pure-Rust path.
avif-decode = { version = "3", default-features = false, optional = true }

# GIF animation engine: animated GIFs are composited in place onto the
# display canvas (one buffer in RAM instead of the image crate's two).
# Same 0.14 line the `image` crate already pulls in — zero extra compile.
gif = { version = "0.14", default-features = false }

# Animated WebP driven directly: `read_frame` decodes each frame into the
# display canvas (the image crate's iterator would allocate a fresh full
# canvas — plus an RGB→RGBA copy — every single frame). Same 0.2 line
# `image` already pulls in.
image-webp = "0.2"

# Decode-only JPEG XL, pure Rust. Optional because the dependency tree is
# comparatively large for an optional format.
jxl-oxide = { version = "0.12", optional = true }

anyhow = "1"
libc = "0.2"

[dev-dependencies]
# Pre-approved test-only crates (see CONTRIBUTING.md): CLI integration
# tests drive the real binary; criterion benchmarks the compose path;
# proptest fuzzes the resampler over arbitrary sizes.
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[[bin]]
name = "wally"
bench = false
test = true

[[bench]]
name = "bench"
harness = false

[features]
default = ["avif"]
avif = ["dep:avif-decode"]
jxl = ["dep:jxl-oxide"]

[profile.release]
# opt-level 3 over "z": wally's CPU cost is decode + resample + blend, and
# "z" makes those kernels ~2x slower for ~1 MB of file-backed .text. A
# wallpaper daemon spends its life asleep; binary bytes are not its
# footprint, CPU during (re)paints is.
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
