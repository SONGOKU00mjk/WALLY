name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dynamically linked glibc builds (no musl static binaries). The
        # x86_64 job doubles as the test runner; aarch64 cross-links via
        # the distro cross toolchain — the code is pure Rust, no
        # libwayland, no pkg-config, no C sources to compile.
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The AVIF decoder's SIMD assembly needs nasm on x86_64 only;
      # aarch64 takes the pure-Rust path.
      - name: Install nasm
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y nasm

      # Cross linker for the aarch64 glibc target (gnu targets link
      # against the system libc, unlike musl's bundled CRT).
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Test (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf wally-${{ matrix.target }}.tar.gz wally

      - uses: actions/upload-artifact@v4
        with:
          name: wally-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wally-${{ matrix.target }}.tar.gz

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          sha256sum wally-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wally-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
