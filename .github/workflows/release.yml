name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both targets build fully static musl binaries. The repo's
        # .cargo/config.toml routes aarch64 linking through rust-lld, so
        # no cross toolchain is needed — the code is pure Rust.
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The AVIF decoder's SIMD assembly needs nasm on x86_64 only;
      # aarch64 takes the pure-Rust path.
      - name: Install nasm
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Test (native)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --release

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf wally-${{ matrix.target }}.tar.gz wally

      - uses: actions/upload-artifact@v4
        with:
          name: wally-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wally-${{ matrix.target }}.tar.gz

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          sha256sum wally-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            wally-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
